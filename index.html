<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reveal Presentation</title>

  <!-- Reveal core -->
  <link rel="stylesheet" href="./reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="./reveal.js/dist/theme/white.css">

  <!-- Font Awesome (offline) -->
  <link rel="stylesheet" href="./fa/css/all.min.css">

  <!-- Your overrides -->
  <link rel="stylesheet" href="./css/icons.css">
  <link rel="stylesheet" href="./css/midi-keyboard.css">
  <link rel="stylesheet" href="./css/youtube-audio.css">
</head>

<body>
  <div class="reveal">
    <div class="slides" id="slides"></div>
  </div>

  <script src="./reveal.js/dist/reveal.js"></script>
  <script src="./js/midi-keyboard.js"></script>
  <script src="./js/youtube-media.js"></script>
  <script>
    const youtubeMedia = window.RevealYouTubeMedia.attach(Reveal);
    Reveal.initialize({ hash: true });
    fetch('../slides.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('slides').innerHTML = html;
        Reveal.sync();
        youtubeMedia.refresh();
      });
  </script>
</body>
</html>
